# SPRSUN -- Lovelace dashboard (custom component)
#
# Generated by: python scripts/generate_sprsun_dashboard.py
# Source: custom_components/sprsun/data/*.json
# Overview requires HACS layout-card (thomasloven).
# Assumes clean entity IDs (no _2). See home-assistant/README.md (Dashboard).
#
# Wire-up (configuration.yaml):
#   lovelace:
#     dashboards:
#       lovelace-sprsun:
#         mode: yaml
#         title: SPRSUN
#         icon: mdi:heat-pump
#         show_in_sidebar: true
#         filename: dashboards/sprsun.yaml
#
# Copy this file to HA config/dashboards/sprsun.yaml

title: SPRSUN
views:
  - title: Overview
    path: overview
    icon: mdi:heat-pump
    type: panel
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: "1fr"
          grid-gap: 12px
          grid-template-areas: |
            "head_ctrl"
            "ctrl"
            "head_run"
            "run"
            "head_temp"
            "temp"
            "head_live"
            "live"
            "head_trend"
            "graphs"
            "head_log"
            "log"
            "head_more"
            "more"
          mediaquery:
            "(max-width: 700px)":
              grid-template-columns: "1fr"
              grid-template-areas: |
                "head_ctrl"
                "ctrl"
                "head_run"
                "run"
                "head_temp"
                "temp"
                "head_live"
                "live"
                "head_trend"
                "graphs"
                "head_log"
                "log"
                "head_more"
                "more"
            "(max-width: 1100px)":
              grid-template-columns: "1fr"
              grid-template-areas: |
                "head_ctrl"
                "ctrl"
                "head_run"
                "run"
                "head_temp"
                "temp"
                "head_live"
                "live"
                "head_trend"
                "graphs"
                "head_log"
                "log"
                "head_more"
                "more"
            "(min-width: 2200px)":
              grid-template-columns: "2fr 1fr"
              grid-template-areas: |
                "head_ctrl head_ctrl"
                "ctrl ctrl"
                "head_run head_temp"
                "run temp"
                "head_live head_live"
                "live live"
                "head_trend head_log"
                "graphs log"
                "head_more head_more"
                "more more"
            "(min-width: 1600px)":
              grid-template-columns: "1.6fr 1fr"
              grid-template-areas: |
                "head_ctrl head_ctrl"
                "ctrl ctrl"
                "head_run head_run"
                "run run"
                "head_temp head_temp"
                "temp temp"
                "head_live head_live"
                "live live"
                "head_trend head_log"
                "graphs log"
                "head_more head_more"
                "more more"
        cards:
          - type: markdown
            content: "## Controls"
            view_layout:
              grid-area: head_ctrl
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: "repeat(auto-fit, minmax(160px, 1fr))"
              grid-gap: 8px
            view_layout:
              grid-area: ctrl
            cards:
              - type: tile
                entity: switch.sprsun_power
                name: "Power"
                icon: mdi:power
                color: accent
                features:
                  - type: toggle
              - type: tile
                entity: select.sprsun_mode
                name: "Mode"
                icon: mdi:thermostat
                features:
                  - type: select-options
              - type: tile
                entity: number.sprsun_heating_setpoint
                name: "Heating"
                icon: mdi:radiator
                color: deep-orange
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: number.sprsun_cooling_setpoint
                name: "Cooling"
                icon: mdi:snowflake
                color: cyan
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: number.sprsun_hot_water_setpoint
                name: "Hot water"
                icon: mdi:water-boiler
                color: amber
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: sensor.sprsun_modbus_refresh
                name: "Bus health"
                icon: mdi:lan-connect
              - type: tile
                entity: button.sprsun_refresh_full_map
                name: "Full sweep"
                icon: mdi:refresh
                color: accent
          - type: markdown
            content: "## Running"
            view_layout:
              grid-area: head_run
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: "repeat(auto-fit, minmax(160px, 1fr))"
              grid-gap: 8px
            view_layout:
              grid-area: run
            cards:
              - type: tile
                entity: binary_sensor.sprsun_compressor
                name: "Compressor"
                icon: mdi:engine
                color: green
                vertical: true
              - type: tile
                entity: binary_sensor.sprsun_fan
                name: "Fan"
                icon: mdi:fan
                color: green
                vertical: true
              - type: tile
                entity: binary_sensor.sprsun_a_c_pump
                name: "A/C PUMP"
                icon: mdi:pump
                color: cyan
                vertical: true
              - type: tile
                entity: binary_sensor.sprsun_pump
                name: "Pump"
                icon: mdi:water-pump
                color: cyan
                vertical: true
          - type: markdown
            content: "## Temperatures"
            view_layout:
              grid-area: head_temp
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: "repeat(auto-fit, minmax(200px, 1fr))"
              grid-gap: 8px
            view_layout:
              grid-area: temp
            cards:
              - type: gauge
                entity: sensor.sprsun_temps_hotwater_temp
                name: "Tank"
                min: 0.0
                max: 70.0
                needle: true
                severity:
                  green: 20
                  yellow: 50
                  red: 60
              - type: gauge
                entity: sensor.sprsun_temps_inlet_temp
                name: "Inlet"
                min: 0.0
                max: 70.0
                needle: true
                severity:
                  green: 20
                  yellow: 50
                  red: 60
              - type: gauge
                entity: sensor.sprsun_temps_outlet_temp
                name: "Outlet"
                min: 0.0
                max: 70.0
                needle: true
                severity:
                  green: 20
                  yellow: 50
                  red: 60
              - type: gauge
                entity: sensor.sprsun_temps_ambi_temp
                name: "Ambient"
                min: -20.0
                max: 50.0
                needle: true
                severity:
                  green: -10
                  yellow: 30
                  red: 40
          - type: markdown
            content: "## Live"
            view_layout:
              grid-area: head_live
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: "repeat(auto-fit, minmax(140px, 1fr))"
              grid-gap: 8px
            view_layout:
              grid-area: live
            cards:
              - type: gauge
                entity: sensor.sprsun_machine_comp_frequency
                name: "Comp Hz"
                min: 0
                max: 120
                needle: true
                severity:
                  green: 0
                  yellow: 70
                  red: 100
              - type: gauge
                entity: sensor.sprsun_machine_dc_fan_1_speed
                name: "Fan 1"
                min: 0
                max: 100
                needle: true
                severity:
                  green: 0
                  yellow: 60
                  red: 90
              - type: tile
                entity: sensor.sprsun_temps_suct_gas_temp
                name: "Suction"
                icon: mdi:thermometer
                vertical: true
              - type: tile
                entity: sensor.sprsun_temps_coil_temp
                name: "Coil"
                icon: mdi:thermometer
                vertical: true
              - type: tile
                entity: sensor.sprsun_temps_exhaust_temp
                name: "Exhaust"
                icon: mdi:thermometer
                vertical: true
              - type: tile
                entity: sensor.sprsun_machine_target_frequency
                name: "Target Hz"
                icon: mdi:sine-wave
                vertical: true
              - type: tile
                entity: sensor.sprsun_machine_eev1_step
                name: "EEV1"
                icon: mdi:valve
                vertical: true
              - type: tile
                entity: sensor.sprsun_machine_comp_current
                name: "Comp A"
                icon: mdi:current-ac
                vertical: true
              - type: tile
                entity: binary_sensor.sprsun_heating_demand
                name: "Heating demand"
                icon: mdi:radiator
                color: amber
                vertical: true
              - type: tile
                entity: binary_sensor.sprsun_cooling_demand
                name: "cooling demand"
                icon: mdi:snowflake
                color: cyan
                vertical: true
              - type: tile
                entity: binary_sensor.sprsun_hotwater_demand
                name: "hotwater demand"
                icon: mdi:water-boiler
                color: amber
                vertical: true
              - type: tile
                entity: binary_sensor.sprsun_flow_switch
                name: "Flow Switch"
                icon: mdi:pipe-valve
                vertical: true
              - type: tile
                entity: binary_sensor.sprsun_defrost
                name: "defrost"
                icon: mdi:snowflake-melt
                color: amber
                vertical: true
              - type: tile
                entity: binary_sensor.sprsun_alarm_downtime
                name: "Alarm downtime"
                icon: mdi:alert
                color: red
                vertical: true
          - type: markdown
            content: "## Trends"
            view_layout:
              grid-area: head_trend
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: "1fr 1fr"
              grid-gap: 8px
              mediaquery:
                "(max-width: 900px)":
                  grid-template-columns: "1fr"
            view_layout:
              grid-area: graphs
            cards:
              - type: history-graph
                title: "Water & ambient · 24 h"
                hours_to_show: 24
                detail: 1
                entities:
                  - entity: sensor.sprsun_temps_hotwater_temp
                    name: "Tank"
                  - entity: sensor.sprsun_temps_inlet_temp
                    name: "Inlet"
                  - entity: sensor.sprsun_temps_outlet_temp
                    name: "Outlet"
                  - entity: sensor.sprsun_temps_ambi_temp
                    name: "Ambient"
              - type: history-graph
                title: "Circuit · 12 h"
                hours_to_show: 12
                detail: 1
                entities:
                  - entity: sensor.sprsun_temps_suct_gas_temp
                    name: "Suction"
                  - entity: sensor.sprsun_temps_coil_temp
                    name: "Coil"
                  - entity: sensor.sprsun_temps_exhaust_temp
                    name: "Exhaust"
          - type: markdown
            content: "## Live log"
            view_layout:
              grid-area: head_log
          - type: vertical-stack
            cards:
              - type: markdown
                content: |
                  **{{ states('sensor.sprsun_live_log') }}** /
                  {{ state_attr('sensor.sprsun_live_log','capacity') }} lines
                  (showing last {{ state_attr('sensor.sprsun_live_log','ui_lines') }})
              
                  ```text
                  {{ state_attr('sensor.sprsun_live_log', 'tail') }}
                  ```
              - type: horizontal-stack
                cards:
                  - type: button
                    name: "Save to PC"
                    icon: mdi:download
                    show_name: true
                    show_icon: true
                    show_state: false
                    tap_action:
                      action: perform-action
                      perform_action: sprsun.download_live_log
                  - type: button
                    name: "Clear log"
                    icon: mdi:notification-clear-all
                    show_name: true
                    show_icon: true
                    show_state: false
                    tap_action:
                      action: perform-action
                      perform_action: sprsun.clear_live_log
                      confirmation:
                        text: "Clear the in-memory live log?"
                  - type: tile
                    entity: sensor.sprsun_live_log
                    name: "Buffer"
                    icon: mdi:text-box-outline
            view_layout:
              grid-area: log
          - type: markdown
            content: "## More"
            view_layout:
              grid-area: head_more
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: "repeat(auto-fit, minmax(130px, 1fr))"
              grid-gap: 8px
            view_layout:
              grid-area: more
            cards:
              - type: button
                name: "Status I/O"
                icon: mdi:electric-switch
                show_name: true
                show_icon: true
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-sprsun/status
              - type: button
                name: "Failures"
                icon: mdi:alert
                show_name: true
                show_icon: true
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-sprsun/failures
              - type: button
                name: "Temps & machine"
                icon: mdi:thermometer
                show_name: true
                show_icon: true
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-sprsun/temps-machine
              - type: button
                name: "Setpoints & schedule"
                icon: mdi:calendar-clock
                show_name: true
                show_icon: true
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-sprsun/setpoints-schedule
              - type: button
                name: "EEV / fan / protect"
                icon: mdi:valve
                show_name: true
                show_icon: true
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-sprsun/eev-fan
              - type: button
                name: "Frequency tables"
                icon: mdi:sine-wave
                show_name: true
                show_icon: true
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-sprsun/frequency
              - type: button
                name: "Unit & calibration"
                icon: mdi:tune
                show_name: true
                show_icon: true
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-sprsun/unit-calib
  - title: Status I/O
    path: status
    icon: mdi:electric-switch
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: "Switching inputs"
            heading_style: title
          - type: tile
            entity: binary_sensor.sprsun_a_c_linkage_switch
            name: "A/C Linkage switch"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_linkage_switch
            name: "Linkage switch"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_heating_linkage
            name: "Heating linkage"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_cooling_linkage
            name: "Cooling linkage"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_flow_switch
            name: "Flow Switch"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_high_pressure_switch
            name: "High pressure switch"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_phase_sequence_detection
            name: "Phase sequence detection"
            grid_options:
              columns: 12
              min_columns: 6

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: "Working status"
            heading_style: title
          - type: tile
            entity: binary_sensor.sprsun_hotwater_demand
            name: "hotwater demand"
            color: green
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_heating_demand
            name: "Heating demand"
            color: green
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_with_or_without_heating
            name: "With or without heating"
            color: green
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_with_or_without_cooling
            name: "With or without cooling"
            color: green
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_antilegionella_on
            name: "Antilegionella on"
            color: green
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_cooling_demand
            name: "cooling demand"
            color: green
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_alarm_downtime
            name: "Alarm downtime"
            color: green
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_defrost
            name: "defrost"
            color: green
            grid_options:
              columns: 12
              min_columns: 6

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: "Outputs 1"
            heading_style: title
          - type: tile
            entity: binary_sensor.sprsun_compressor
            name: "Compressor"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_fan
            name: "Fan"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_4_way_valve
            name: "4-way valve"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_high_or_low_fan_speed
            name: "High or low fan speed"
            grid_options:
              columns: 12
              min_columns: 6

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: "Outputs 2"
            heading_style: title
          - type: tile
            entity: binary_sensor.sprsun_chassis_heater
            name: "Chassis heater"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_heating_heater
            name: "Heating heater"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_three_way_valve
            name: "Three-way valve"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_hotwater_heater
            name: "Hotwater heater"
            grid_options:
              columns: 12
              min_columns: 6

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: "Outputs 3"
            heading_style: title
          - type: tile
            entity: binary_sensor.sprsun_a_c_pump
            name: "A/C PUMP"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_crank_heater
            name: "Crank heater"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_assistant_solenoid_valve
            name: "Assistant solenoid valve"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_pump
            name: "Pump"
            grid_options:
              columns: 12
              min_columns: 6

      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: "Control flags"
            heading_style: title
          - type: tile
            entity: binary_sensor.sprsun_power_on
            name: "Power ON"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_mv_mode
            name: "MV mode"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_manual_frequency_selection
            name: "Manual frequency selection"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_av_mode
            name: "AV MODE"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_av_init_outlet_stp
            name: "AV init outlet stp"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_constant_freq_adj
            name: "Constant freq adj"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_pressure_switch_enable
            name: "Pressure switch enable"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_av_cool_enable
            name: "AV cool enable"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_av_control_mode
            name: "AV control mode"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_dcfan_1_enable
            name: "DCfan 1 enable"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_dcfan_2_enable
            name: "DCfan 2 enable"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_parameters_reset_0_unuse_1_use
            name: "Parameters reset 0-Unuse ，1-use"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_failure_reset_0_unuse_1_use
            name: "Failure reset 0-Unuse，1-use"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_antilegionella_enable_0_unuse_1_use
            name: "antilegionella Enable 0-Unuse，1-use"
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_two_three_function_0_unuse_1_use
            name: "Two/Three function 0-Unuse，1-use"
            grid_options:
              columns: 12
              min_columns: 6

      - type: grid
        column_span: 4
        cards:
          - type: entities
            title: "Raw status registers"
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.sprsun_status_switching_input_symbol
                name: "Switching Input Symbol"
              - entity: sensor.sprsun_status_working_status_mark
                name: "Working Status Mark"
              - entity: sensor.sprsun_status_output_symbol_1
                name: "Output Symbol 1"
              - entity: sensor.sprsun_status_output_symbol_2
                name: "Output Symbol 2"
              - entity: sensor.sprsun_status_output_symbol_3
                name: "Output Symbol 3"
              - entity: sensor.sprsun_control_flags_parameter_marker_definition
                name: "Parameter Marker Definition"
              - entity: sensor.sprsun_control_flags_control_mark_1
                name: "Control Mark 1"
              - entity: sensor.sprsun_control_flags_control_mark_2
                name: "Control Mark 2"
              - entity: sensor.sprsun_control_flags_p06_unit_mode
                name: "P06 Unit Mode"
            grid_options:
              columns: 48
              min_columns: 6

  - title: Failures
    path: failures
    icon: mdi:alert
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: "Failure symbol 1"
            heading_style: title
          - type: tile
            entity: binary_sensor.sprsun_hotwater_temp
            name: "Hotwater temp"
            color: red
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_ambi_temp
            name: "Ambi temp"
            color: red
            grid_options:
              columns: 12
              min_columns: 6
          - type: tile
            entity: binary_sensor.sprsun_coil_temp
            name: "coil temp"
            color: red
            grid_options:
              columns: 12
