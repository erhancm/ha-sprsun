# SPRSUN custom component — YAML example
#
# 1. Disable the native modbus package (do NOT run both):
#      # packages:
#      #   heatpump: !include heatpump-day.yaml
#
# 2. Copy custom_components/sprsun into your HA config/custom_components/
#
# 3. Add the block below to configuration.yaml (use your secrets):
#
# Dual-rate (v0.2): scan_interval = light overview poll; full_interval = full
# register_limit map. Matches proven PC panel behaviour (2026-08-10).

sprsun:
  host: !secret modbus_host
  port: !secret modbus_port
  slave: !secret modbus_device_id
  scan_interval: 5
  full_interval: 20
  message_wait_milliseconds: 350
  full_wait_milliseconds: 450
  max_block: 125
  # Full register map (413). Drop to 50/100/… if the EW11 struggles.
  register_limit: 413

# ---------------------------------------------------------------------------
# Recorder — recommended with SPRSUN
#
# Memory: the 10k-line live log is a fixed ring buffer (~1–2 MB RAM max).
# The recorder DB is the only growing store, and the integration writes a row
# only when a register value changes (no force_update, no per-poll timestamp
# attribute), so temperature history is cheap enough to keep.
#
# Exclude the two diagnostic entities whose attributes still change every poll:
# the live-log tail (~5 KB) and the refresh timing.
# ---------------------------------------------------------------------------
# recorder:
#   purge_keep_days: 10
#   exclude:
#     entities:
#       - sensor.sprsun_live_log
#       - sensor.sprsun_modbus_refresh
